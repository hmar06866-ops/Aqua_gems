<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aqua Gems — Offline</title>
  <style>
    :root {
      --green: #3dff9a;
      --green2: #00e5a8;
      --cyan: #4ef0ff;
      --muted: #7f9b91;
      --text: #e8fff6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      text-align: center;
      padding: 24px;
      overflow: hidden;
      background: #02040a;
    }

    /* Deep animated background */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 90% 55% at 50% -15%, rgba(0, 229, 168, 0.22), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(78, 240, 255, 0.1), transparent 50%),
        radial-gradient(ellipse 40% 35% at 0% 90%, rgba(61, 255, 154, 0.08), transparent 50%),
        #02040a;
    }

    .grid {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image:
        linear-gradient(rgba(61, 255, 154, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61, 255, 154, 0.055) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, black 10%, transparent 72%);
      animation: gridMove 22s linear infinite;
    }
    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 44px 44px; }
    }

    .scan {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.14) 3px,
        rgba(0,0,0,0.14) 6px
      );
      opacity: 0.4;
    }

    /* Soft floating orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(70px);
      z-index: 1; pointer-events: none; opacity: 0.4;
      animation: orbFloat 16s ease-in-out infinite;
    }
    .orb.a { width: 320px; height: 320px; background: #00e5a8; top: -8%; left: -10%; }
    .orb.b { width: 260px; height: 260px; background: #4ef0ff; bottom: -5%; right: -8%; animation-delay: -5s; }
    .orb.c { width: 180px; height: 180px; background: #3dff9a; top: 45%; left: 55%; opacity: 0.22; animation-delay: -9s; }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -50px) scale(1.1); }
    }

    /* Horizontal scan beam */
    .beam {
      position: fixed; left: 0; right: 0; height: 2px; z-index: 3;
      background: linear-gradient(90deg, transparent, var(--green), var(--cyan), transparent);
      box-shadow: 0 0 20px var(--green), 0 0 40px rgba(61, 255, 154, 0.4);
      opacity: 0.55;
      animation: beamScan 5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes beamScan {
      0% { top: 8%; opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { top: 92%; opacity: 0; }
    }

    .panel {
      position: relative; z-index: 10;
      max-width: 460px; width: 100%;
      padding: 40px 28px 36px;
      border-radius: 24px;
      background: rgba(6, 16, 24, 0.65);
      border: 1px solid rgba(61, 255, 154, 0.2);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 30px 80px rgba(0,0,0,0.55),
        0 0 60px rgba(61, 255, 154, 0.08);
      animation: panelIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .panel::before {
      content: "";
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--green), var(--cyan), transparent);
      animation: edgeGlow 3s ease-in-out infinite;
    }
    @keyframes edgeGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .logo-wrap {
      position: relative;
      margin: 0 auto 28px;
      width: min(300px, 78vw);
    }
    .logo {
      width: 100%; height: auto; display: block;
      filter: drop-shadow(0 0 28px rgba(61, 255, 154, 0.5));
      animation: logoFloat 4.5s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 22px rgba(61, 255, 154, 0.45)); }
      50% { transform: translateY(-12px) scale(1.03); filter: drop-shadow(0 0 40px rgba(61, 255, 154, 0.75)); }
    }

    /* Ring around logo */
    .ring {
      position: absolute; inset: -18px;
      border-radius: 50%;
      border: 1px solid rgba(61, 255, 154, 0.25);
      box-shadow: 0 0 24px rgba(61, 255, 154, 0.15);
      animation: ringSpin 12s linear infinite;
      pointer-events: none;
    }
    .ring::after {
      content: "";
      position: absolute; top: -3px; left: 50%; width: 8px; height: 8px;
      margin-left: -4px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }
    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 14px;
      background: linear-gradient(90deg, #ffffff, var(--green), var(--cyan), #ffffff);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 5s linear infinite;
    }
    @keyframes shimmer {
      to { background-position: 220% center; }
    }

    p {
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.98rem;
      margin-bottom: 10px;
    }
    p strong { color: var(--green); font-weight: 600; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(61, 255, 154, 0.35);
      background: rgba(61, 255, 154, 0.06);
      color: var(--green);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(61, 255, 154, 0.18);
      animation: statusPulse 2.2s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%, 100% { box-shadow: 0 0 14px rgba(61, 255, 154, 0.12); }
      50% { box-shadow: 0 0 32px rgba(61, 255, 154, 0.35); }
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .footer-note {
      margin-top: 28px;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(127, 155, 145, 0.7);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
  <div class="beam"></div>

  <div class="panel">
    <div class="logo-wrap">
      <div class="ring"></div>
      <img
        class="logo"
        src="/static/logo.png"
        alt="Aqua Gems"
      />
    </div>

    <h1>System Offline</h1>
    <p>
      Aqua Gems is temporarily offline for <strong>updates</strong>,
      <strong>bug fixes</strong>, and maintenance.
    </p>
    <p>
      Site deposits &amp; withdraws are paused.<br />
      The Discord bot may still be online.
    </p>

    <div class="status">
      <span class="dot"></span>
      We’ll be right back
    </div>

    <div class="footer-note">Aqua Gems · Secure channel</div>
  </div>
</body>
</html>
